<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction</title>
    <link type="text/css" rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Heart Disease Prediction Form</h1>
        <form method="post" action="{{url_for('home')}}">
            <div class="info">
                <label for="age">Age</label>
                <input type="number" id="age" name="a" placeholder="Enter your age" required>
            </div>
            <div class="info">
                <label for="sex">Gender</label>
                <select id="sex" name="b" required>
                    <option value="">Select gender</option>
                    <option value="1">Male</option>
                    <option value="0">Female</option>
                </select>
            </div>
            <div class="info">
                <label for="cp" title="Chest Pain Type">Chest Pain Type</label>
                <select id="cp" name="c" required>
                    <option value="">Select type</option>
                    <option value="0">Typical Angina</option>
                    <option value="1">Atypical Angina</option>
                    <option value="2">Non-anginal Pain</option>
                    <option value="3">Asymptomatic</option>
                </select>
            </div>
            <div class="info">
                <label for="trestbps">Trestbps</label>
                <input type="number" id="trestbps" name='d' placeholder="Trestbps" step="any" required>
            </div>
            <div class="info">
                <label for="chol">Chol:</label>
                <input type="number" id="chol" name='e' placeholder="Chol Level" step="any" required>
            </div>
            <div class="info">
                <label for="fbs">FBS</label>
                <input type="number" id="fbs" name='f' placeholder="FBS" step="any" required>
            </div>
            <div class="info">
                <label for="restecg">RestECG:</label>
                <input type="number" id="restecg" name='g' placeholder="RestECG" step="any" required>
            </div>
            <div class="info">
                <label for="thalach">Thalach:</label>
                <input type="number" id="thalach" name='h' placeholder="Thalach Level" step="any" required>
            </div>
            <div class="info">
                <label for="exang">Exang:</label>
                <input type="number" id="exang" name='i' placeholder="Exang" step="any" required>
            </div>
            <div class="info">
                <label for="oldpeak">Old peak:</label>
                <input type="number" id="oldpeak" name='j' placeholder="Old peak in Decimal value" step="any" required>
            </div>
            <div class="info">
                <label for="slope">Slope</label>
                <input type="number" id="slope" name='k' placeholder="Slope value" step="any" required>
            </div>
            <div class="info">
                <label for="ca">CA:</label>
                <input type="number" id="ca" name='l' placeholder="CA" step="any" required>
            </div>
            <div class="info">
                <label for="thal">Thal:</label>
                <input type="number" id="thal" name='m' placeholder="Thal Level" step="any" required>
            </div>
            <div class="submit">
                <button type="submit">Predict Result</button>
            </div>
        </form>
    </div>
</body>
</html>
